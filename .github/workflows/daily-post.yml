name: Daily Crypto Market Post

# Fires at 06:00 and 07:00 UTC. post.py checks UK local time itself: it posts on
# the first run that lands at 07:00 UK or later (up to 12:59 UK), so the post
# goes out at 7 AM UK all year round (DST-safe) AND still goes out if GitHub
# delays a scheduled run by a few hours.
#
# Exactly one post per day is guaranteed by a "sent today" marker committed to
# state/last_sent.txt - the second run of the day sees the marker and skips.
#
# The finished post is (a) DMed to Chris as a record and (b) published into the
# Locked Money community THROUGH CHRIS'S OWN TELEGRAM ACCOUNT, so it appears as
# him, not as the bot. That needs TELEGRAM_API_ID / TELEGRAM_API_HASH /
# TELEGRAM_SESSION (a Telethon StringSession created by login.py).
on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish as Chris (me = his Saved Messages, for tests)"
        type: choice
        default: locked_money
        options:
          - locked_money
          - me
      skip_dm:
        description: "Skip the DM copy to Chris (tests only)"
        type: boolean
        default: false
      skip_community:
        description: "Skip the community post (tests only)"
        type: boolean
        default: false

# Needed so post.py can write the sent-today marker back to the repo.
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Telethon (for posting as Chris)
        run: python3 -m pip install --quiet telethon

      - name: Run the daily crypto post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Posts as Chris (his own account), not as the bot.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TARGET: ${{ github.event.inputs.target || 'locked_money' }}
          SKIP_DM: ${{ github.event.inputs.skip_dm == 'true' && '1' || '0' }}
          SKIP_COMMUNITY: ${{ github.event.inputs.skip_community == 'true' && '1' || '0' }}
          # "1" lets a manual test run fire outside the window; scheduled runs are gated.
          ALLOW_ANY_HOUR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 post.py

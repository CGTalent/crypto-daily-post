name: Daily Crypto Market Post

# Fires at 06:00 and 07:00 UTC. post.py checks UK local time itself: it posts on
# the first run that lands at 07:00 UK or later (up to 12:59 UK), so the post
# goes out at 7 AM UK all year round (DST-safe) AND still goes out if GitHub
# delays a scheduled run by a few hours.
#
# Exactly one post per day is guaranteed by a "sent today" marker committed to
# state/last_sent.txt - the second run of the day sees the marker and skips.
on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch: {}

# Needed so post.py can write the sent-today marker back to the repo.
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the daily crypto post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "1" lets a manual test run fire outside the window; scheduled runs are gated.
          ALLOW_ANY_HOUR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 post.py
